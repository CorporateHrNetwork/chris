services:
  - type: web
    runtime: static
    name: chris-sales-demo
    repo: https://github.com/CorporateHrNetwork/chris
    branch: feature/chris-sales-demo-environment
    autoDeployTrigger: commit
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
