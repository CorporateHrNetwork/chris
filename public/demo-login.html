<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta http-equiv="Cache-Control" content="no-cache,no-store,must-revalidate">
<title>CHRiS Demo — Sign In</title>
<style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;background:linear-gradient(135deg,#032d1d,#07110c 55%,#000);font-family:Arial,Helvetica,sans-serif;color:#f8faf9}
.card{width:min(100%,460px);padding:38px;border:1px solid rgba(212,175,55,.38);border-radius:24px;background:rgba(3,12,8,.94);box-shadow:0 28px 80px rgba(0,0,0,.46)}
.logo{display:block;width:245px;max-width:92%;margin:0 auto 12px}.title{text-align:center;color:#d4af37;font-size:24px;font-weight:900;margin:0 0 6px}.sub{text-align:center;color:#a8c3b5;font-size:13px;margin:0 0 24px}.demo{padding:10px 12px;margin-bottom:20px;border:1px solid rgba(212,175,55,.35);border-radius:10px;background:rgba(212,175,55,.08);color:#f7d66a;text-align:center;font-size:12px;font-weight:800}.field{margin-bottom:17px}label{display:block;margin-bottom:8px;color:#d7e4dc;font-size:13px;font-weight:800}input{width:100%;padding:13px 14px;border:1px solid rgba(8,122,67,.7);border-radius:11px;background:rgba(2,10,7,.62);color:#fff;font-size:14px;outline:none}button{width:100%;border:0;border-radius:11px;padding:14px;background:#087a43;color:#fff;font-size:15px;font-weight:800;cursor:pointer}button:disabled{opacity:.65;cursor:not-allowed}.msg{display:none;margin-bottom:18px;padding:12px 14px;border-radius:10px;font-size:13px;line-height:1.5}.error{display:block;background:#fff1f2;border:1px solid #fecdd3;color:#b91c1c}.ok{display:block;background:#ecfdf5;border:1px solid #bbf7d0;color:#166534}.foot{text-align:center;color:#7faf96;font-size:12px;font-weight:700;margin-top:22px}
</style>
</head>
<body>
<main class="card">
<img class="logo" src="/assets/chris-logo.png" alt="CHRiS">
<h1 class="title">Sales Demo Environment</h1>
<p class="sub">CorporateHR Network Information System</p>
<div class="demo">DEMO ENVIRONMENT • FICTIONAL DATA ONLY • NOT PRODUCTION</div>
<div id="msg" class="msg"></div>
<form id="loginForm" autocomplete="off">
<div class="field"><label for="email">Email Address</label><input id="email" type="email" value="demo.hr@chris.crnetwork.com.ng" autocomplete="off" required></div>
<div class="field"><label for="password">Password</label><input id="password" type="password" autocomplete="new-password" required></div>
<button id="submit" type="submit">Sign In to Demo</button>
</form>
<div class="foot">People | Performance | Rewards</div>
</main>
<script>
const API="https://chris-sales-demo-api.onrender.com";
const ORG="chris-demo-company";
const form=document.getElementById("loginForm"), email=document.getElementById("email"), password=document.getElementById("password"), submit=document.getElementById("submit"), msg=document.getElementById("msg");
function show(text,ok=false){msg.textContent=text;msg.className="msg "+(ok?"ok":"error");}
form.addEventListener("submit",async e=>{
 e.preventDefault(); msg.className="msg"; submit.disabled=true; submit.textContent="Signing in…";
 try{
  const r=await fetch(API+"/api/auth/login",{method:"POST",mode:"cors",cache:"no-store",headers:{"Content-Type":"application/json"},body:JSON.stringify({email:email.value.trim().toLowerCase(),password:password.value,organizationSlug:ORG})});
  let data={}; try{data=await r.json()}catch{}
  if(!r.ok) throw new Error(data.message||"Unable to sign in.");
  const storage=sessionStorage;
  storage.setItem("chris_token",data.data.token);
  storage.setItem("chris_user",JSON.stringify(data.data.user));
  storage.setItem("chris_organization",JSON.stringify(data.data.organization));
  localStorage.removeItem("chris_token");localStorage.removeItem("chris_user");localStorage.removeItem("chris_organization");
  show("Sign-in successful. Opening CHRiS…",true);
  location.replace("/?demo_session="+Date.now());
 }catch(err){show(err.message||"Unable to connect to the CHRiS demo server.");}
 finally{submit.disabled=false;submit.textContent="Sign In to Demo";}
});
</script>
</body>
</html>
