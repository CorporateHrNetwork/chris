name: CHRiS One-Time Dependency Audit

on:
  push:
    branches:
      - sprint/leave-attendance-management
    paths:
      - ".github/workflows/security-audit-once.yml"

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Frontend dependency audit
        shell: bash
        run: |
          set +e
          npm ci
          echo "=== FRONTEND PRODUCTION AUDIT ==="
          npm audit --omit=dev
          echo "=== FRONTEND FULL AUDIT ==="
          npm audit
          exit 0
      - name: Backend dependency audit
        working-directory: backend
        shell: bash
        run: |
          set +e
          npm ci
          echo "=== BACKEND PRODUCTION AUDIT ==="
          npm audit --omit=dev
          echo "=== BACKEND FULL AUDIT ==="
          npm audit
          exit 0
