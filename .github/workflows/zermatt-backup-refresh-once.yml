name: Zermatt One-Time Encrypted Backup Refresh

on:
  push:
    branches:
      - fix/zermatt-supabase-pilot-transfer
    paths:
      - ".github/workflows/zermatt-backup-refresh-once.yml"

permissions:
  contents: read

jobs:
  backup:
    name: Encrypted Supabase live snapshot
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment: zermatt-db-transfer
    env:
      SUPABASE_PASSWORD: ${{ secrets.ZERMATT_SUPABASE_PASSWORD }}
      BACKUP_PASSPHRASE: ${{ secrets.ZERMATT_BACKUP_PASSPHRASE }}
      PGSSLMODE: require
    steps:
      - name: Prepare protected live database connection
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os
          from urllib.parse import quote
          password = os.environ.get('SUPABASE_PASSWORD', '')
          passphrase = os.environ.get('BACKUP_PASSPHRASE', '')
          if not password or '\n' in password or len(passphrase) < 20:
              raise SystemExit('Protected Supabase password and encryption passphrase are required.')
          target = ('postgresql://postgres.ldmwsptljgnspwtwcdtm:' + quote(password, safe='')
                    + '@aws-0-eu-central-1.pooler.supabase.com:5432/postgres')
          print('::add-mask::' + target)
          with open(os.environ['GITHUB_ENV'], 'a') as handle:
              handle.write('TARGET_URL=' + target + '\n')
          PY

      - name: Install PostgreSQL 17 client
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get install -y -qq ca-certificates curl
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl -fsSL -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc https://www.postgresql.org/media/keys/ACCC4CF8.asc
          . /etc/os-release
          printf 'deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt %s-pgdg main\n' "$VERSION_CODENAME" | sudo tee /etc/apt/sources.list.d/pgdg.list > /dev/null
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-client-17
          echo '/usr/lib/postgresql/17/bin' >> "$GITHUB_PATH"

      - name: Export, encrypt, and verify live snapshot
        shell: bash
        run: |
          set -euo pipefail
          trap 'rm -f "$RUNNER_TEMP/zermatt-live.dump" "$RUNNER_TEMP/verify.dump"' EXIT
          migrations=$(psql "$TARGET_URL" -X -A -t -v ON_ERROR_STOP=1 -c 'SELECT count(*) FROM public._prisma_migrations WHERE finished_at IS NOT NULL')
          organizations=$(psql "$TARGET_URL" -X -A -t -v ON_ERROR_STOP=1 -c 'SELECT count(*) FROM public.organizations')
          employees=$(psql "$TARGET_URL" -X -A -t -v ON_ERROR_STOP=1 -c 'SELECT count(*) FROM public.employees')
          test "$migrations" -ge 64
          test "$organizations" -eq 2
          test "$employees" -ge 300
          pg_dump --format=custom --no-owner --no-privileges --schema=public --file "$RUNNER_TEMP/zermatt-live.dump" "$TARGET_URL"
          test -s "$RUNNER_TEMP/zermatt-live.dump"
          pg_restore --list "$RUNNER_TEMP/zermatt-live.dump" > /dev/null
          openssl enc -aes-256-cbc -pbkdf2 -iter 200000 -salt -in "$RUNNER_TEMP/zermatt-live.dump" -out "$RUNNER_TEMP/zermatt-live.dump.enc" -pass env:BACKUP_PASSPHRASE
          openssl enc -d -aes-256-cbc -pbkdf2 -iter 200000 -in "$RUNNER_TEMP/zermatt-live.dump.enc" -out "$RUNNER_TEMP/verify.dump" -pass env:BACKUP_PASSPHRASE
          cmp -s "$RUNNER_TEMP/zermatt-live.dump" "$RUNNER_TEMP/verify.dump"
          pg_restore --list "$RUNNER_TEMP/verify.dump" > /dev/null
          printf 'Backup validated: employees=%s migrations=%s organizations=%s\n' "$employees" "$migrations" "$organizations"
          sha256sum "$RUNNER_TEMP/zermatt-live.dump.enc"

      - name: Upload encrypted snapshot
        uses: actions/upload-artifact@v4
        with:
          name: zermatt-live-backup-refresh-${{ github.run_id }}
          path: ${{ runner.temp }}/zermatt-live.dump.enc
          if-no-files-found: error
          retention-days: 30

      - name: Remove runner copy
        if: always()
        run: rm -f "$RUNNER_TEMP/zermatt-live.dump.enc" "$RUNNER_TEMP/zermatt-live.dump" "$RUNNER_TEMP/verify.dump"
