name: CHRiS Loan Repayment Input Regression

on:
  pull_request:
    paths:
      - 'src/pages/Loans.jsx'
      - 'src/utils/loanRepaymentTerm.js'
      - 'tests/loanRepaymentTerm.test.mjs'
      - '.github/workflows/loan-repayment-input-regression.yml'

permissions:
  contents: read

jobs:
  loan-repayment:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify both repayment inputs, final instalment and validation
        run: node --test tests/loanRepaymentTerm.test.mjs
