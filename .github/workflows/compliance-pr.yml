      - name: Enforce initial bundle budget
        run: |
          node - <<'NODE'
          const fs = require("fs");
          const html = fs.readFileSync("dist/index.html", "utf8");
          const match = html.match(/<script[^>]+src="\/assets\/(index-[^"]+\.js)"/);
          if (!match) throw new Error("Unable to identify the CHRiS initial JavaScript bundle.");
          const file = `dist/assets/${match[1]}`;
          const bytes = fs.statSync(file).size;
          const limit = 500 * 1024;
          console.log(`CHRiS initial bundle: ${(bytes / 1024).toFixed(2)} KB; budget: 500 KB`);
          if (bytes > limit) {
            throw new Error(`Initial CHRiS bundle exceeded 500 KB budget: ${(bytes / 1024).toFixed(2)} KB`);
          }
          NODE

