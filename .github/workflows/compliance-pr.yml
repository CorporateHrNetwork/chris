name: CHRiS Compliance PR Gate

on:
  pull_request:
    paths:
      - "backend/**"
      - "src/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/compliance-pr.yml"
  push:
    branches:
      - fix/zermatt-supabase-pilot-transfer
  workflow_dispatch:
    inputs:
      operation:
        description: Zermatt pilot database operation
        type: choice
        required: true
        default: verify
        options:
          - verify
          - copy
          - refresh
          - render-preflight
      confirm_write_freeze:
        description: Enter ZERMATT_WRITE_FROZEN only after the live Zermatt API is suspended
        type: string
        required: false

permissions:
  contents: read

concurrency:
  group: compliance-pr-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  zermatt-login-repair:
    name: Restore Zermatt database reads through encrypted pooler
    if: >-
      github.event_name == 'push' && github.ref == 'refs/heads/fix/zermatt-supabase-pilot-transfer' && github.event.head_commit.message == 'ops: repair Zermatt pilot TLS login'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: zermatt-db-transfer
    env:
      RENDER_API_KEY: ${{ secrets.ZERMATT_RENDER_API_KEY }}
      SUPABASE_PASSWORD: ${{ secrets.ZERMATT_SUPABASE_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install production driver
        working-directory: backend
        run: npm ci
      - name: Prove actual database reads and update only the exact Render service
        working-directory: backend
        run: |
          node - <<'NODE'
          const { Client } = require('pg');
          const { URL } = require('url');
          const https = require('https');
          const password = process.env.SUPABASE_PASSWORD;
          const token = process.env.RENDER_API_KEY;
          if (!password || !token) throw Error('Protected credentials missing');
          const target = new URL('postgresql://aws-0-eu-central-1.pooler.supabase.com:5432/postgres');
          target.username = 'postgres.ldmwsptljgnspwtwcdtm';
          target.password = password;
          target.searchParams.set('sslmode', 'require');
          target.searchParams.set('uselibpqcompat', 'true');
          const targetUrl = target.toString();
          console.log('::add-mask::' + targetUrl);
          const request = (path, method = 'GET', payload) => new Promise((resolve, reject) => {
            const req = https.request('https://api.render.com/v1/services/srv-dai875uk1f9s73co1rk0' + path, {
              method, headers: { Authorization: 'Bearer ' + token, Accept: 'application/json',
                ...(payload ? { 'Content-Type': 'application/json' } : {}) },
              timeout: 30000
            }, res => {
              let body = ''; res.on('data', chunk => body += chunk);
              res.on('end', () => {
                if (res.statusCode < 200 || res.statusCode >= 300) return reject(Error('Render request failed: ' + res.statusCode));
                try { resolve(body ? JSON.parse(body) : {}); } catch { resolve({}); }
              });
            });
            req.on('error', reject); req.on('timeout', () => req.destroy(Error('Render timeout')));
            if (payload) req.write(JSON.stringify(payload));
            req.end();
          });
          const delay = ms => new Promise(r => setTimeout(r, ms));
          (async () => {
            const client = new Client({ connectionString: targetUrl });
            try {
              await client.connect();
              const { rows } = await client.query('SELECT (SELECT count(*) FROM public.users) AS users, (SELECT count(*) FROM public.organizations) AS organizations');
              if (Number(rows[0].users) < 14 || Number(rows[0].organizations) !== 2) throw Error('Pilot identities do not match Zermatt copy');
              console.log('Protected pilot query passed: user and tenant tables readable over encrypted connection.');
            } finally { await client.end(); }
            const service = await request('');
            if (service.id !== 'srv-dai875uk1f9s73co1rk0' || service.name !== 'chris-zermatt-api' ||
                service.ownerId !== 'tea-dahvevcs728c73doovgg' || service.suspended !== 'not_suspended') throw Error('Service identity changed');
            const current = await request('/env-vars/DATABASE_URL');
            const old = new URL((current.envVar || current).value);
            if (old.hostname !== target.hostname || old.username !== target.username || old.pathname !== target.pathname ||
                old.password !== target.password) throw Error('Live service is not on approved Supabase pilot');
            await request('/env-vars/DATABASE_URL', 'PUT', { value: targetUrl });
            const updated = await request('/env-vars/DATABASE_URL');
            if ((updated.envVar || updated).value !== targetUrl) throw Error('Render connection update failed');
            const deploy = await request('/deploys', 'POST', { deployMode: 'deploy_only' });
            if (!deploy.id) throw Error('Render deploy ID missing');
            for (let i = 0; i < 100; i++) {
              const latest = await request('/deploys/' + deploy.id);
              if (latest.status === 'live') {
                console.log('Render database connection repair deployed live.');
                return;
              }
              if (['build_failed', 'update_failed', 'canceled', 'deactivated'].includes(latest.status))
                throw Error('Render deploy failed: ' + latest.status);
              await delay(7000);
            }
            throw Error('Render deploy timed out');
          })().catch(error => { console.error(error.message); process.exitCode = 1; });
          NODE

  zermatt-render-preflight:
    name: Verify Render cutover access without changes
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/fix/zermatt-supabase-pilot-transfer' && inputs.operation == 'render-preflight'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    environment: zermatt-db-transfer
    env:
      RENDER_API_KEY: ${{ secrets.ZERMATT_RENDER_API_KEY }}
      SOURCE_URL: ${{ secrets.ZERMATT_RENDER_DATABASE_URL }}
    steps:
      - name: Check exact service and current database connection privately
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import os
          from urllib.parse import urlsplit
          from urllib.request import Request, urlopen

          token = os.environ.get('RENDER_API_KEY', '')
          source = os.environ.get('SOURCE_URL', '')
          if not token or not source or not (urlsplit(source).hostname or '').endswith('.render.com'):
              raise SystemExit('A Render API key and original Render database URL are required.')
          base = 'https://api.render.com/v1/services/srv-dai875uk1f9s73co1rk0'
          def get(path):
              request = Request(base + path, headers={
                  'Authorization': 'Bearer ' + token,
                  'Accept': 'application/json',
              })
              with urlopen(request, timeout=20) as response:
                  return json.load(response)
          service = get('')
          if service.get('id') != 'srv-dai875uk1f9s73co1rk0' or service.get('name') != 'chris-zermatt-api' or service.get('ownerId') != 'tea-dahvevcs728c73doovgg':
              raise SystemExit('Render service identity differs; stop the cutover.')
          if service.get('suspended') != 'not_suspended':
              raise SystemExit('Zermatt API is not in its expected running state.')
          item = get('/env-vars/DATABASE_URL')
          env_var = item.get('envVar', item)
          from urllib.parse import unquote
          live_url = env_var.get('value', '')
          original = urlsplit(source)
          running = urlsplit(live_url)
          db_id = 'dpg-dai7a3e7bikc73dm8rgg-a'
          valid = {
              'original_render_host': (original.hostname or '').endswith('.render.com') and db_id in (original.hostname or ''),
              'running_render_host': (running.hostname or '').startswith(db_id),
              'matching_database': original.path == running.path == '/chris_3eg6',
              'matching_user': unquote(original.username or '') == unquote(running.username or '') == 'chris_3eg6_user',
              'matching_password': bool(original.password) and unquote(original.password or '') == unquote(running.password or ''),
              'postgres_urls': original.scheme in ('postgres', 'postgresql') and running.scheme in ('postgres', 'postgresql'),
              'postgres_ports': original.port in (None, 5432) and running.port in (None, 5432),
          }
          if not all(valid.values()):
              print('Private database identity checks:', {key: 'pass' if value else 'fail' for key, value in valid.items()})
              raise SystemExit('The live API and protected source may not point to the same Render database; stop the cutover.')
          print('Read-only preflight passed: exact Zermatt API, running state, and matching original database identity verified.')
          PY

  zermatt-pilot-copy:
    name: Copy Zermatt to isolated Supabase pilot
    # Manual, single-branch transfer. Configure an environment restricted to this
    # branch; its secrets must never be available to a pull_request job.
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/fix/zermatt-supabase-pilot-transfer' && inputs.operation == 'copy'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    environment: zermatt-db-transfer
    env:
      SOURCE_URL: ${{ secrets.ZERMATT_RENDER_DATABASE_URL }}
      SUPABASE_PASSWORD: ${{ secrets.ZERMATT_SUPABASE_PASSWORD }}
      BACKUP_PASSPHRASE: ${{ secrets.ZERMATT_BACKUP_PASSPHRASE }}
      PGSSLMODE: require
    steps:
      - name: Construct the approved pilot Session pooler URL privately
        run: |
          python3 - <<'PY'
          import os
          from urllib.parse import quote
          password = os.environ.get('SUPABASE_PASSWORD', '')
          if not password or '\n' in password:
              raise SystemExit('Missing or invalid Supabase database password.')
          url = ('postgresql://postgres.ldmwsptljgnspwtwcdtm:' + quote(password, safe='')
                 + '@aws-0-eu-central-1.pooler.supabase.com:5432/postgres')
          print('::add-mask::' + url)
          with open(os.environ['GITHUB_ENV'], 'a') as env_file:
              env_file.write('TARGET_URL=' + url + '\n')
          PY

      - name: Install PostgreSQL 16 client
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-client-16

      - name: Check credentials and empty isolated destination
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os
          from urllib.parse import urlsplit, unquote
          source = os.environ.get('SOURCE_URL', '')
          target = os.environ.get('TARGET_URL', '')
          password = os.environ.get('BACKUP_PASSPHRASE', '')
          if len(password) < 20:
              raise SystemExit('Missing backup encryption passphrase (minimum 20 characters).')
          for label, url, host_suffix in [('source', source, '.render.com'), ('target', target, '.pooler.supabase.com')]:
              parsed = urlsplit(url)
              if parsed.scheme not in ('postgres', 'postgresql') or not (parsed.hostname or '').endswith(host_suffix) or not parsed.username or not parsed.password:
                  raise SystemExit(f'Invalid {label} connection configuration.')
          t = urlsplit(target)
          if unquote(t.username) != 'postgres.ldmwsptljgnspwtwcdtm' or t.port != 5432 or t.path != '/postgres':
              raise SystemExit('Destination is not the approved Zermatt pilot Session pooler.')
          PY
          source_migrations=$(psql "$SOURCE_URL" -X -A -t -v ON_ERROR_STOP=1 -c 'SELECT count(*) FROM public._prisma_migrations WHERE finished_at IS NOT NULL')
          source_organizations=$(psql "$SOURCE_URL" -X -A -t -v ON_ERROR_STOP=1 -c 'SELECT count(*) FROM public.organizations')
          target_tables=$(psql "$TARGET_URL" -X -A -t -v ON_ERROR_STOP=1 -c "SELECT count(*) FROM information_schema.tables WHERE table_schema='public' AND table_type='BASE TABLE'")
          printf 'Completed source migrations: %s; source organizations: %s; destination public tables: %s\n' "$source_migrations" "$source_organizations" "$target_tables"
          test "$source_migrations" -ge 58
          test "$source_organizations" -ge 1
          test "$target_tables" -eq 0

      - name: Dump CHRiS public schema into ephemeral runner storage
        shell: bash
        run: |
          set -euo pipefail
          pg_dump --format=custom --no-owner --no-privileges --schema=public --file "$RUNNER_TEMP/zermatt.dump" "$SOURCE_URL"
          pg_restore --list "$RUNNER_TEMP/zermatt.dump" > "$RUNNER_TEMP/zermatt.toc"
          test -s "$RUNNER_TEMP/zermatt.dump"
          printf 'Archive created and validated. Size: %s bytes\n' "$(stat -c %s "$RUNNER_TEMP/zermatt.dump")"

      - name: Restore public tables without replacing Supabase managed schema
        shell: bash
        run: |
          set -euo pipefail
          # Supabase already owns public. Keep its schema object and services.
          awk '!/^[0-9]+;.* SCHEMA - public /' "$RUNNER_TEMP/zermatt.toc" > "$RUNNER_TEMP/zermatt.restore.toc"
          pg_restore --exit-on-error --no-owner --no-privileges --use-list "$RUNNER_TEMP/zermatt.restore.toc" --dbname "$TARGET_URL" "$RUNNER_TEMP/zermatt.dump"
          # Prisma connects as postgres. Keep employee and payroll tables out of
          # Supabase's browser/API roles even if the Data API is enabled later.
          psql "$TARGET_URL" -X -v ON_ERROR_STOP=1 <<'SQL'
          REVOKE ALL ON ALL TABLES IN SCHEMA public FROM anon, authenticated, PUBLIC;
          REVOKE ALL ON ALL SEQUENCES IN SCHEMA public FROM anon, authenticated, PUBLIC;
          ALTER DEFAULT PRIVILEGES FOR ROLE postgres IN SCHEMA public REVOKE ALL ON TABLES FROM anon, authenticated, PUBLIC;
          ALTER DEFAULT PRIVILEGES FOR ROLE postgres IN SCHEMA public REVOKE ALL ON SEQUENCES FROM anon, authenticated, PUBLIC;
          SQL

      - name: Verify the first copy
        shell: bash
        run: |
          set -euo pipefail
          for relation in organizations users employees payroll_runs payroll_run_lines statutory_remittance_batches employee_exit_processes _prisma_migrations; do
            source_count=$(psql "$SOURCE_URL" -X -A -t -v ON_ERROR_STOP=1 -c "SELECT count(*) FROM public.\"$relation\"")
            target_count=$(psql "$TARGET_URL" -X -A -t -v ON_ERROR_STOP=1 -c "SELECT count(*) FROM public.\"$relation\"")
            printf '%s: source %s; pilot %s\n' "$relation" "$source_count" "$target_count"
            if [ "$source_count" != "$target_count" ]; then
              echo 'Counts differ; keep Render live and repeat under a write freeze before cutover.'
              exit 1
            fi
          done
          echo 'First-copy counts match. Render remains live; this is not the final cutover.'

      - name: Encrypt backup and remove plaintext
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          if [ -s "$RUNNER_TEMP/zermatt.dump" ] && [ -n "$BACKUP_PASSPHRASE" ]; then
            openssl enc -aes-256-cbc -pbkdf2 -iter 200000 -salt -in "$RUNNER_TEMP/zermatt.dump" -out "$RUNNER_TEMP/zermatt.dump.enc" -pass env:BACKUP_PASSPHRASE
            sha256sum "$RUNNER_TEMP/zermatt.dump.enc" | cut -d ' ' -f 1
          fi
          rm -f "$RUNNER_TEMP/zermatt.dump" "$RUNNER_TEMP/zermatt.toc" "$RUNNER_TEMP/zermatt.restore.toc"

      - name: Retain encrypted recovery copy for download
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: zermatt-encrypted-snapshot
          path: ${{ runner.temp }}/zermatt.dump.enc
          if-no-files-found: ignore
          retention-days: 14

  zermatt-pilot-refresh:
    name: Refresh isolated Zermatt pilot after live write freeze
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/fix/zermatt-supabase-pilot-transfer' && inputs.operation == 'refresh' && inputs.confirm_write_freeze == 'ZERMATT_WRITE_FROZEN'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment: zermatt-db-transfer
    env:
      SOURCE_URL: ${{ secrets.ZERMATT_RENDER_DATABASE_URL }}
      SUPABASE_PASSWORD: ${{ secrets.ZERMATT_SUPABASE_PASSWORD }}
      BACKUP_PASSPHRASE: ${{ secrets.ZERMATT_BACKUP_PASSPHRASE }}
      RENDER_API_KEY: ${{ secrets.ZERMATT_RENDER_API_KEY }}
      PGSSLMODE: require
    steps:
      - uses: actions/checkout@v4
      - name: Verify the exact API is suspended before touching the pilot
        run: |
          python3 - <<'PY'
          import json, os
          from urllib.request import Request, urlopen
          url='https://api.render.com/v1/services/srv-dai875uk1f9s73co1rk0'
          with urlopen(Request(url, headers={'Authorization': 'Bearer '+os.environ['RENDER_API_KEY']}), timeout=25) as response:
              service=json.load(response)
          if service.get('id') != 'srv-dai875uk1f9s73co1rk0' or service.get('suspended') != 'suspended':
              raise SystemExit('Write freeze absent; pilot is untouched.')
          print('Zermatt API write freeze independently confirmed.')
          PY
      - name: Prepare exact transfer endpoints and PostgreSQL 17 client
        run: |
          python3 - <<'PY'
          import os
          from urllib.parse import quote, urlsplit
          source = urlsplit(os.environ.get('SOURCE_URL', ''))
          if source.scheme not in ('postgres', 'postgresql') or not (source.hostname or '').endswith('.render.com') or not source.password:
              raise SystemExit('Source must be the approved Render PostgreSQL connection.')
          password = os.environ.get('SUPABASE_PASSWORD', '')
          if not password or '\n' in password or len(os.environ.get('BACKUP_PASSPHRASE', '')) < 20:
              raise SystemExit('Database password or backup passphrase is missing or invalid.')
          target = ('postgresql://postgres.ldmwsptljgnspwtwcdtm:' + quote(password, safe='')
                    + '@aws-0-eu-central-1.pooler.supabase.com:5432/postgres')
          print('::add-mask::' + target)
          with open(os.environ['GITHUB_ENV'], 'a') as f:
              f.write('TARGET_URL=' + target + '\n')
          PY
          sudo apt-get install -y -qq ca-certificates curl
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl -fsSL -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc https://www.postgresql.org/media/keys/ACCC4CF8.asc
          . /etc/os-release
          printf 'deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt %s-pgdg main\n' "$VERSION_CODENAME" | sudo tee /etc/apt/sources.list.d/pgdg.list > /dev/null
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-client-17
          echo '/usr/lib/postgresql/17/bin' >> "$GITHUB_PATH"
      - name: Check both database identities and record source baseline
        shell: bash
        run: |
          set -euo pipefail
          for url in "$SOURCE_URL" "$TARGET_URL"; do
            migration_count=$(psql "$url" -X -A -t -v ON_ERROR_STOP=1 -c 'SELECT count(*) FROM public._prisma_migrations WHERE finished_at IS NOT NULL')
            employee_count=$(psql "$url" -X -A -t -v ON_ERROR_STOP=1 -c 'SELECT count(*) FROM public.employees')
            org_count=$(psql "$url" -X -A -t -v ON_ERROR_STOP=1 -c 'SELECT count(*) FROM public.organizations')
            test "$migration_count" -ge 64
            test "$employee_count" -ge 300
            test "$org_count" -eq 2
          done
          psql "$SOURCE_URL" -X -q -A -t -v ON_ERROR_STOP=1 -f backend/scripts/zermatt-pilot-fingerprint.sql > "$RUNNER_TEMP/before.fingerprint"
      - name: Back up frozen Render source and existing pilot
        shell: bash
        run: |
          set -euo pipefail
          pg_dump --format=custom --no-owner --no-privileges --schema=public --file "$RUNNER_TEMP/final-source.dump" "$SOURCE_URL"
          pg_dump --format=custom --no-owner --no-privileges --schema=public --file "$RUNNER_TEMP/pre-refresh-pilot.dump" "$TARGET_URL"
          pg_restore --list "$RUNNER_TEMP/final-source.dump" > "$RUNNER_TEMP/final-source.toc"
          test -s "$RUNNER_TEMP/final-source.dump"
          test -s "$RUNNER_TEMP/pre-refresh-pilot.dump"
          psql "$SOURCE_URL" -X -q -A -t -v ON_ERROR_STOP=1 -f backend/scripts/zermatt-pilot-fingerprint.sql > "$RUNNER_TEMP/after.fingerprint"
          if ! cmp -s "$RUNNER_TEMP/before.fingerprint" "$RUNNER_TEMP/after.fingerprint"; then
            echo 'Source changed while copying. Keep Render active and resolve the write freeze.'
            exit 1
          fi
          openssl enc -aes-256-cbc -pbkdf2 -iter 200000 -salt -in "$RUNNER_TEMP/final-source.dump" -out "$RUNNER_TEMP/final-source.dump.enc" -pass env:BACKUP_PASSPHRASE
          openssl enc -aes-256-cbc -pbkdf2 -iter 200000 -salt -in "$RUNNER_TEMP/pre-refresh-pilot.dump" -out "$RUNNER_TEMP/pre-refresh-pilot.dump.enc" -pass env:BACKUP_PASSPHRASE
      - name: Upload encrypted recovery archives before touching pilot
        uses: actions/upload-artifact@v4
        with:
          name: zermatt-final-refresh-recovery
          path: |
            ${{ runner.temp }}/final-source.dump.enc
            ${{ runner.temp }}/pre-refresh-pilot.dump.enc
          if-no-files-found: error
          retention-days: 14
      - name: Atomically replace application objects in isolated pilot
        shell: bash
        run: |
          set -euo pipefail
          # Keep Supabase's public schema object and managed schemas intact.
          awk '!/^[0-9]+;.* SCHEMA - public /' "$RUNNER_TEMP/final-source.toc" > "$RUNNER_TEMP/final-source.restore.toc"
          pg_restore --single-transaction --clean --if-exists --exit-on-error --no-owner --no-privileges --use-list "$RUNNER_TEMP/final-source.restore.toc" --dbname "$TARGET_URL" "$RUNNER_TEMP/final-source.dump"
          psql "$TARGET_URL" -X -v ON_ERROR_STOP=1 <<'SQL'
          REVOKE ALL ON ALL TABLES IN SCHEMA public FROM anon, authenticated, PUBLIC;
          REVOKE ALL ON ALL SEQUENCES IN SCHEMA public FROM anon, authenticated, PUBLIC;
          ALTER DEFAULT PRIVILEGES FOR ROLE postgres IN SCHEMA public REVOKE ALL ON TABLES FROM anon, authenticated, PUBLIC;
          ALTER DEFAULT PRIVILEGES FOR ROLE postgres IN SCHEMA public REVOKE ALL ON SEQUENCES FROM anon, authenticated, PUBLIC;
          SQL
      - name: Reconcile all application rows before cutover
        shell: bash
        run: |
          set -euo pipefail
          psql "$SOURCE_URL" -X -q -A -t -v ON_ERROR_STOP=1 -f backend/scripts/zermatt-pilot-fingerprint.sql > "$RUNNER_TEMP/final-source.fingerprint"
          psql "$TARGET_URL" -X -q -A -t -v ON_ERROR_STOP=1 -f backend/scripts/zermatt-pilot-fingerprint.sql > "$RUNNER_TEMP/final-pilot.fingerprint"
          if ! cmp -s "$RUNNER_TEMP/final-source.fingerprint" "$RUNNER_TEMP/final-pilot.fingerprint"; then
            echo 'Full-table reconciliation failed; do not point Zermatt API to the pilot.'
            exit 1
          fi
          if ! cmp -s "$RUNNER_TEMP/after.fingerprint" "$RUNNER_TEMP/final-source.fingerprint"; then
            echo 'Source changed after backup; do not cut over.'
            exit 1
          fi
          echo "Verified identical contents in $(wc -l < "$RUNNER_TEMP/final-source.fingerprint") application tables. Live API is still suspended on Render."
      - name: Remove plaintext archives from runner
        if: always()
        shell: bash
        run: |
          rm -f "$RUNNER_TEMP/final-source.dump" "$RUNNER_TEMP/pre-refresh-pilot.dump" "$RUNNER_TEMP/final-source.toc" "$RUNNER_TEMP/final-source.restore.toc" "$RUNNER_TEMP"/*.fingerprint

  zermatt-pilot-verify:
    name: Verify Zermatt pilot copy without writes
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/fix/zermatt-supabase-pilot-transfer' && inputs.operation == 'verify'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: zermatt-db-transfer
    env:
      SOURCE_URL: ${{ secrets.ZERMATT_RENDER_DATABASE_URL }}
      SUPABASE_PASSWORD: ${{ secrets.ZERMATT_SUPABASE_PASSWORD }}
      PGSSLMODE: require
    steps:
      - uses: actions/checkout@v4
      - name: Prepare approved read-only connections
        run: |
          python3 - <<'PY'
          import os
          from urllib.parse import quote, urlsplit
          source = urlsplit(os.environ.get('SOURCE_URL', ''))
          if not source.hostname or not source.hostname.endswith('.render.com') or not source.password:
              raise SystemExit('Source must be the approved Render PostgreSQL connection.')
          password = os.environ.get('SUPABASE_PASSWORD', '')
          if not password or '\n' in password:
              raise SystemExit('Missing or invalid pilot password.')
          target = ('postgresql://postgres.ldmwsptljgnspwtwcdtm:' + quote(password, safe='')
                    + '@aws-0-eu-central-1.pooler.supabase.com:5432/postgres')
          print('::add-mask::' + target)
          with open(os.environ['GITHUB_ENV'], 'a') as f:
              f.write('TARGET_URL=' + target + '\n')
          PY
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-client-16
      - name: Compare all public table row fingerprints and migration records
        shell: bash
        run: |
          set -euo pipefail
          # A single repeatable-read snapshot per database prevents the check
          # from observing different points in time within one connection.
          psql "$SOURCE_URL" -X -q -A -t -v ON_ERROR_STOP=1 -f backend/scripts/zermatt-pilot-fingerprint.sql > "$RUNNER_TEMP/source.fingerprint"
          psql "$TARGET_URL" -X -q -A -t -v ON_ERROR_STOP=1 -f backend/scripts/zermatt-pilot-fingerprint.sql > "$RUNNER_TEMP/pilot.fingerprint"
          if ! diff -u <(cut -f 1 "$RUNNER_TEMP/source.fingerprint") <(cut -f 1 "$RUNNER_TEMP/pilot.fingerprint"); then
            echo 'Application table names differ. Keep Render live.'
            exit 1
          fi
          # Report only the table names that differ; row hashes and financial
          # values stay inside the runner. Source writes after the copy are expected.
          if ! cmp -s "$RUNNER_TEMP/source.fingerprint" "$RUNNER_TEMP/pilot.fingerprint"; then
            join -t $'\t' "$RUNNER_TEMP/source.fingerprint" "$RUNNER_TEMP/pilot.fingerprint" | awk -F '\t' '$2 != $4 || $3 != $5 { print "Changed table: " $1 " (source rows " $2 ", pilot rows " $4 ")" }'
            echo 'A final copy during a write freeze is required before cutover.'
            exit 1
          fi
          echo "Verified identical contents for $(wc -l < "$RUNNER_TEMP/source.fingerprint") application tables. Render remains active."
          rm -f "$RUNNER_TEMP/source.fingerprint" "$RUNNER_TEMP/pilot.fingerprint"

  backend-compliance:
    name: Backend compliance acceptance
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
