name: CHRiS Compliance PR Gate

on:
  pull_request:
    paths:
      - "backend/**"
      - "src/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/compliance-pr.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: compliance-pr-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  zermatt-pilot-copy:
    name: Copy Zermatt to isolated Supabase pilot
    # Manual, single-branch transfer. Configure an environment restricted to this
    # branch; its secrets must never be available to a pull_request job.
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/fix/zermatt-supabase-pilot-transfer'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    environment: zermatt-db-transfer
    env:
      SOURCE_URL: ${{ secrets.ZERMATT_RENDER_DATABASE_URL }}
      SUPABASE_PASSWORD: ${{ secrets.ZERMATT_SUPABASE_PASSWORD }}
      BACKUP_PASSPHRASE: ${{ secrets.ZERMATT_BACKUP_PASSPHRASE }}
      PGSSLMODE: require
    steps:
      - name: Construct the approved pilot Session pooler URL privately
        run: |
          python3 - <<'PY'
          import os
          from urllib.parse import quote
          password = os.environ.get('SUPABASE_PASSWORD', '')
          if not password or '\n' in password:
              raise SystemExit('Missing or invalid Supabase database password.')
          url = ('postgresql://postgres.ldmwsptljgnspwtwcdtm:' + quote(password, safe='')
                 + '@aws-0-eu-central-1.pooler.supabase.com:5432/postgres')
          print('::add-mask::' + url)
          with open(os.environ['GITHUB_ENV'], 'a') as env_file:
              env_file.write('TARGET_URL=' + url + '\n')
          PY

      - name: Install PostgreSQL 16 client
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-client-16

      - name: Check credentials and empty isolated destination
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os
          from urllib.parse import urlsplit, unquote
          source = os.environ.get('SOURCE_URL', '')
          target = os.environ.get('TARGET_URL', '')
          password = os.environ.get('BACKUP_PASSPHRASE', '')
          if len(password) < 20:
              raise SystemExit('Missing backup encryption passphrase (minimum 20 characters).')
          for label, url, host_suffix in [('source', source, '.render.com'), ('target', target, '.pooler.supabase.com')]:
              parsed = urlsplit(url)
              if parsed.scheme not in ('postgres', 'postgresql') or not (parsed.hostname or '').endswith(host_suffix) or not parsed.username or not parsed.password:
                  raise SystemExit(f'Invalid {label} connection configuration.')
          t = urlsplit(target)
          if unquote(t.username) != 'postgres.ldmwsptljgnspwtwcdtm' or t.port != 5432 or t.path != '/postgres':
              raise SystemExit('Destination is not the approved Zermatt pilot Session pooler.')
          PY
          source_migrations=$(psql "$SOURCE_URL" -X -A -t -v ON_ERROR_STOP=1 -c 'SELECT count(*) FROM public._prisma_migrations WHERE finished_at IS NOT NULL')
          source_organizations=$(psql "$SOURCE_URL" -X -A -t -v ON_ERROR_STOP=1 -c 'SELECT count(*) FROM public.organizations')
          target_tables=$(psql "$TARGET_URL" -X -A -t -v ON_ERROR_STOP=1 -c "SELECT count(*) FROM information_schema.tables WHERE table_schema='public' AND table_type='BASE TABLE'")
          printf 'Completed source migrations: %s; source organizations: %s; destination public tables: %s\n' "$source_migrations" "$source_organizations" "$target_tables"
          test "$source_migrations" -ge 58
          test "$source_organizations" -ge 1
          test "$target_tables" -eq 0

      - name: Dump CHRiS public schema into ephemeral runner storage
        shell: bash
        run: |
          set -euo pipefail
          pg_dump --format=custom --no-owner --no-privileges --schema=public --file "$RUNNER_TEMP/zermatt.dump" "$SOURCE_URL"
          pg_restore --list "$RUNNER_TEMP/zermatt.dump" > "$RUNNER_TEMP/zermatt.toc"
          test -s "$RUNNER_TEMP/zermatt.dump"
          printf 'Archive created and validated. Size: %s bytes\n' "$(stat -c %s "$RUNNER_TEMP/zermatt.dump")"

      - name: Restore public tables without replacing Supabase managed schema
        shell: bash
        run: |
          set -euo pipefail
          # Supabase already owns public. Keep its schema object and services.
          awk '!/^[0-9]+;.* SCHEMA - public /' "$RUNNER_TEMP/zermatt.toc" > "$RUNNER_TEMP/zermatt.restore.toc"
          pg_restore --exit-on-error --no-owner --no-privileges --use-list "$RUNNER_TEMP/zermatt.restore.toc" --dbname "$TARGET_URL" "$RUNNER_TEMP/zermatt.dump"
          # Prisma connects as postgres. Keep employee and payroll tables out of
          # Supabase's browser/API roles even if the Data API is enabled later.
          psql "$TARGET_URL" -X -v ON_ERROR_STOP=1 <<'SQL'
          REVOKE ALL ON ALL TABLES IN SCHEMA public FROM anon, authenticated, PUBLIC;
          REVOKE ALL ON ALL SEQUENCES IN SCHEMA public FROM anon, authenticated, PUBLIC;
          ALTER DEFAULT PRIVILEGES FOR ROLE postgres IN SCHEMA public REVOKE ALL ON TABLES FROM anon, authenticated, PUBLIC;
          ALTER DEFAULT PRIVILEGES FOR ROLE postgres IN SCHEMA public REVOKE ALL ON SEQUENCES FROM anon, authenticated, PUBLIC;
          SQL

      - name: Verify the first copy
        shell: bash
        run: |
          set -euo pipefail
          for relation in organizations users employees payroll_runs payroll_run_lines statutory_remittance_batches employee_exit_processes _prisma_migrations; do
            source_count=$(psql "$SOURCE_URL" -X -A -t -v ON_ERROR_STOP=1 -c "SELECT count(*) FROM public.\"$relation\"")
            target_count=$(psql "$TARGET_URL" -X -A -t -v ON_ERROR_STOP=1 -c "SELECT count(*) FROM public.\"$relation\"")
            printf '%s: source %s; pilot %s\n' "$relation" "$source_count" "$target_count"
            if [ "$source_count" != "$target_count" ]; then
              echo 'Counts differ; keep Render live and repeat under a write freeze before cutover.'
              exit 1
            fi
          done
          echo 'First-copy counts match. Render remains live; this is not the final cutover.'

      - name: Encrypt backup and remove plaintext
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          if [ -s "$RUNNER_TEMP/zermatt.dump" ] && [ -n "$BACKUP_PASSPHRASE" ]; then
            openssl enc -aes-256-cbc -pbkdf2 -iter 200000 -salt -in "$RUNNER_TEMP/zermatt.dump" -out "$RUNNER_TEMP/zermatt.dump.enc" -pass env:BACKUP_PASSPHRASE
            sha256sum "$RUNNER_TEMP/zermatt.dump.enc" | cut -d ' ' -f 1
          fi
          rm -f "$RUNNER_TEMP/zermatt.dump" "$RUNNER_TEMP/zermatt.toc" "$RUNNER_TEMP/zermatt.restore.toc"

      - name: Retain encrypted recovery copy for download
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: zermatt-encrypted-snapshot
          path: ${{ runner.temp }}/zermatt.dump.enc
          if-no-files-found: ignore
          retention-days: 14

  backend-compliance:
    name: Backend compliance acceptance
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install backend dependencies
        run: npm ci

      - name: Validate Prisma schema
        run: npx prisma validate

      - name: Generate Prisma Client
        run: npx prisma generate

      - name: Check critical backend syntax
        run: |
          node --check src/services/zermattFinancialSupportService.js
          node --check src/services/zermattVariablePayrollService.js
          node --check src/services/payrollPayslipEmailService.js
          node --check src/services/payrollApprovalComplianceService.js
          node --check src/services/employeePayrollAuthoritySyncService.js
          node --check src/services/excelNativeChartService.js
          node --check src/services/statutoryObligationService.js
          node --check src/services/statutoryRemittanceService.js
          node --check src/routes/payrollRoutes.js
          node --check src/routes/payrollIntegrationRoutes.js
          node --check src/routes/complianceRoutes.js
          node --check src/services/nigeriaPayrollComplianceService.js

      - name: Rehearse full migration chain
        run: npm run test:migration:compliance

      - name: Run compliance safeguards
        run: npm run test:compliance

      - name: Run compliance administrative API and UI acceptance
        run: npm run test:compliance:api

      - name: Run Zermatt client-readiness acceptance
        env:
          DATABASE_URL: postgresql://test:test@127.0.0.1:5432/chris_test
        run: |
          node --test \
            tests/zermattBranchHrAccessAcceptance.test.js \
            tests/zermattBranchHrFinancialInputAndTopUpSafetyAcceptance.test.js \
            tests/zermattEmploymentResourcesAcceptance.test.js \
            tests/zermattLeaveAttendanceBranchIntegrationAcceptance.test.js \
            tests/zermattLoanOriginationPayrollReopenAcceptance.test.js \
            tests/zermattLeaveAllowanceAcceptance.test.js \
            tests/zermattPayrollActivationRelease1Acceptance.test.js \
            tests/zermattPartTimePayrollExemptionAcceptance.test.js \
            tests/zermattReportingSecurityRelease1Acceptance.test.js \
            tests/zermattWorkforceControlsAndConnectedModulesAcceptance.test.js

      - name: Run focused payroll and exit regressions
        run: |
          node tests/payrollIntegratedLiabilitiesPayslipsStatutoryAcceptance.test.js
          node tests/payrollPayslipEmailWithheldStatutoryAcceptance.test.js
          node tests/payslipEmployeePaymentLoanDetailsAcceptance.test.js
          node tests/payrollTransactionScalabilityAcceptance.test.js
          node tests/employmentTypeStatutoryExemptionPayslipScrollAcceptance.test.js
          node tests/frontendBootRecoveryAcceptance.test.js
          node tests/frontendPerformanceCodeSplittingAcceptance.test.js
          node tests/payrollRuntimePerformanceAcceptance.test.js
          node tests/payrollExternalExportWorkflowAcceptance.test.js
          node tests/payrollRecalculationLoanRecoveryHistoryAcceptance.test.js
          node tests/payrollConnectedDashboardAcceptance.test.js
          node tests/payrollReadinessErrorUxAcceptance.test.js
          node tests/payrollExportDashboardInteractivityAcceptance.test.js
          node tests/excelNativeChartsRuntime.test.js
          node tests/reportsPerformancePrintPayrollDimensionsAcceptance.test.js
          node tests/payrollExportLoanRecoveryAcceptance.test.js
          node tests/zermattPayslipBrandingAcceptance.test.js
          node tests/zermattVariablePayrollInputsAcceptance.test.js
          node tests/exitRegister.test.js
          node tests/employeeEmploymentGovernanceAcceptance.test.js
          node tests/employeeDataOperations.test.js
          node tests/zermattBulkEmployeePayrollReadinessAcceptance.test.js
          node tests/unifiedEmployeeOnboardingAcceptance.test.js
          node tests/employeePayrollAuthorityAutoSyncAcceptance.test.js
          node tests/employeeExitSettlementAccountAcceptance.test.js
          node tests/exitSettlementNoticeCalculation.test.js
          node tests/employeeExitNoticeInitiationAcceptance.test.js
          node tests/employeeExitDocumentUploadAcceptance.test.js
          node tests/employeeExitMultiDocumentPaymentProofAcceptance.test.js
          node tests/employeeExitSettlementPresentationAcceptance.test.js
          node tests/chrisGlobalPrintVisualLanguageAcceptance.test.js
          node tests/documentsWorkspaceAcceptance.test.js
          node tests/zermattGapClosureAcceptance.test.mjs
          node --test tests/zermattEmploymentLevelV3Acceptance.test.js
          node --test tests/zermattRoleGradeReconciliationAcceptance.test.js
          node --check scripts/reconcile-zermatt-v3-role-grades.cjs
          node tests/chrisPayslipPrintCultureAcceptance.test.js
          node tests/employeeAssignmentSearchAcceptance.test.js
          node tests/employeeAssignmentSuccessResetAcceptance.test.js
          node tests/unifiedOnboardingSidebarNavigationAcceptance.test.js
          node tests/employeeExportNameReconciliation.test.js
          node tests/employeeOnboardingNationalityAutofillAcceptance.test.mjs
          node tests/zermattOnboardingDocumentCatalogueAcceptance.test.mjs
          node tests/onboardingPartialSectionPersistenceAcceptance.test.js
          node tests/zermattEmployeeExportOrderingAcceptance.test.js
          node tests/rentReliefBulkUploadAcceptance.test.js
          node tests/rentReliefBulkVerificationAcceptance.test.js

  frontend-build:
    name: Frontend production build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install frontend dependencies
        run: npm ci

      - name: Build frontend
        run: npm run build

      - name: Enforce initial bundle budget
        run: |
          node - <<'NODE'
          const fs = require("fs");
          const html = fs.readFileSync("dist/index.html", "utf8");
          const match = html.match(/<script[^>]+src="\/assets\/(index-[^"]+\.js)"/);
          if (!match) throw new Error("Unable to identify the CHRiS initial JavaScript bundle.");
          const file = `dist/assets/${match[1]}`;
          const bytes = fs.statSync(file).size;
          const limit = 500 * 1024;
          console.log(`CHRiS initial bundle: ${(bytes / 1024).toFixed(2)} KB; budget: 500 KB`);
          if (bytes > limit) {
            throw new Error(`Initial CHRiS bundle exceeded 500 KB budget: ${(bytes / 1024).toFixed(2)} KB`);
          }
          NODE
