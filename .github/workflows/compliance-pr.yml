name: CHRiS Compliance PR Gate

on:
  pull_request:
    paths:
      - "backend/**"
      - "src/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/compliance-pr.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: compliance-pr-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  backend-compliance:
    name: Backend compliance acceptance
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install backend dependencies
        run: npm ci

      - name: Validate Prisma schema
        run: npx prisma validate

      - name: Generate Prisma Client
        run: npx prisma generate

      - name: Check critical backend syntax
        run: |
          node --check src/services/zermattFinancialSupportService.js
          node --check src/services/zermattVariablePayrollService.js
          node --check src/routes/payrollRoutes.js
          node --check src/services/nigeriaPayrollComplianceService.js

      - name: Rehearse full migration chain
        run: npm run test:migration:compliance

      - name: Run compliance safeguards
        run: npm run test:compliance

      - name: Run compliance administrative API and UI acceptance
        run: npm run test:compliance:api

      - name: Run focused payroll and exit regressions
        run: |
          node tests/payrollIntegratedLiabilitiesPayslipsStatutoryAcceptance.test.js
          node tests/zermattVariablePayrollInputsAcceptance.test.js
          node tests/exitRegister.test.js
          node tests/employeeEmploymentGovernanceAcceptance.test.js

  frontend-build:
    name: Frontend production build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install frontend dependencies
        run: npm ci

      - name: Build frontend
        run: npm run build
