name: CHRiS Compliance PR Gate

on:
  pull_request:
    paths:
      - "backend/**"
      - "src/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/compliance-pr.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: compliance-pr-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  backend-compliance:
    name: Backend compliance acceptance
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install backend dependencies
        run: npm ci

      - name: Validate Prisma schema
        run: npx prisma validate

      - name: Generate Prisma Client
        run: npx prisma generate

      - name: Check critical backend syntax
        run: |
          node --check src/services/zermattFinancialSupportService.js
          node --check src/services/zermattVariablePayrollService.js
          node --check src/services/payrollPayslipEmailService.js
          node --check src/services/payrollApprovalComplianceService.js
          node --check src/services/employeePayrollAuthoritySyncService.js
          node --check src/services/excelNativeChartService.js
          node --check src/services/statutoryObligationService.js
          node --check src/services/statutoryRemittanceService.js
          node --check src/routes/payrollRoutes.js
          node --check src/routes/payrollIntegrationRoutes.js
          node --check src/routes/complianceRoutes.js
          node --check src/services/nigeriaPayrollComplianceService.js

      - name: Rehearse full migration chain
        run: npm run test:migration:compliance

      - name: Run compliance safeguards
        run: npm run test:compliance

      - name: Run compliance administrative API and UI acceptance
        run: npm run test:compliance:api

      - name: Run focused payroll and exit regressions
        run: |
          node tests/payrollIntegratedLiabilitiesPayslipsStatutoryAcceptance.test.js
          node tests/payrollPayslipEmailWithheldStatutoryAcceptance.test.js
          node tests/payslipEmployeePaymentLoanDetailsAcceptance.test.js
          node tests/payrollTransactionScalabilityAcceptance.test.js
          node tests/employmentTypeStatutoryExemptionPayslipScrollAcceptance.test.js
          node tests/frontendBootRecoveryAcceptance.test.js
          node tests/frontendPerformanceCodeSplittingAcceptance.test.js
          node tests/payrollRuntimePerformanceAcceptance.test.js
          node tests/payrollExternalExportWorkflowAcceptance.test.js
          node tests/payrollRecalculationLoanRecoveryHistoryAcceptance.test.js
          node tests/payrollConnectedDashboardAcceptance.test.js
          node tests/payrollReadinessErrorUxAcceptance.test.js
          node tests/payrollExportDashboardInteractivityAcceptance.test.js
          node tests/excelNativeChartsRuntime.test.js
          node tests/reportsPerformancePrintPayrollDimensionsAcceptance.test.js
          node tests/payrollExportLoanRecoveryAcceptance.test.js
          node tests/zermattPayslipBrandingAcceptance.test.js
          node tests/zermattVariablePayrollInputsAcceptance.test.js
          node tests/exitRegister.test.js
          node tests/employeeEmploymentGovernanceAcceptance.test.js
          node tests/employeeDataOperations.test.js
          node tests/zermattBulkEmployeePayrollReadinessAcceptance.test.js
          node tests/unifiedEmployeeOnboardingAcceptance.test.js
          node tests/employeePayrollAuthorityAutoSyncAcceptance.test.js
          node tests/employeeExitSettlementAccountAcceptance.test.js
          node tests/exitSettlementNoticeCalculation.test.js
          node tests/employeeExitNoticeInitiationAcceptance.test.js
          node tests/employeeExitDocumentUploadAcceptance.test.js
          node tests/employeeExitMultiDocumentPaymentProofAcceptance.test.js
          node tests/employeeExitSettlementPresentationAcceptance.test.js
          node tests/chrisGlobalPrintVisualLanguageAcceptance.test.js
          node tests/documentsWorkspaceAcceptance.test.js
          node tests/zermattGapClosureAcceptance.test.mjs
          node tests/chrisPayslipPrintCultureAcceptance.test.js
          node tests/employeeAssignmentSearchAcceptance.test.js
          node tests/employeeAssignmentSuccessResetAcceptance.test.js
          node tests/unifiedOnboardingSidebarNavigationAcceptance.test.js
          node tests/employeeExportNameReconciliation.test.js
          node tests/employeeOnboardingNationalityAutofillAcceptance.test.mjs
          node tests/zermattOnboardingDocumentCatalogueAcceptance.test.mjs
          node tests/onboardingPartialSectionPersistenceAcceptance.test.js
          node tests/zermattEmployeeExportOrderingAcceptance.test.js
          node tests/rentReliefBulkUploadAcceptance.test.js
          node tests/rentReliefBulkVerificationAcceptance.test.js

  frontend-build:
    name: Frontend production build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install frontend dependencies
        run: npm ci

      - name: Build frontend
        run: npm run build

      - name: Enforce initial bundle budget
        run: |
          node - <<'NODE'
          const fs = require("fs");
          const html = fs.readFileSync("dist/index.html", "utf8");
          const match = html.match(/<script[^>]+src="\/assets\/(index-[^"]+\.js)"/);
          if (!match) throw new Error("Unable to identify the CHRiS initial JavaScript bundle.");
          const file = `dist/assets/${match[1]}`;
          const bytes = fs.statSync(file).size;
          const limit = 500 * 1024;
          console.log(`CHRiS initial bundle: ${(bytes / 1024).toFixed(2)} KB; budget: 500 KB`);
          if (bytes > limit) {
            throw new Error(`Initial CHRiS bundle exceeded 500 KB budget: ${(bytes / 1024).toFixed(2)} KB`);
          }
          NODE
