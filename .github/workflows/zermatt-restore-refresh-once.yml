name: Zermatt One-Time Restore Drill

on:
  push:
    branches:
      - fix/zermatt-supabase-pilot-transfer
    paths:
      - ".github/workflows/zermatt-restore-refresh-once.yml"

permissions:
  contents: read
  actions: read

jobs:
  restore:
    name: Restore latest encrypted snapshot in disposable PostgreSQL
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment: zermatt-db-transfer
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: disposable-restore-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      BACKUP_PASSPHRASE: ${{ secrets.ZERMATT_BACKUP_PASSPHRASE }}
      PGHOST: localhost
      PGPORT: 5432
      PGUSER: postgres
      PGPASSWORD: disposable-restore-only
      PGDATABASE: postgres
    steps:
      - name: Download fresh encrypted backup
        uses: actions/download-artifact@v4
        with:
          name: zermatt-live-backup-refresh-36609223334
          run-id: 36609223334
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/restore-drill

      - name: Install PostgreSQL 17 client
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get install -y -qq ca-certificates curl
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl -fsSL -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc https://www.postgresql.org/media/keys/ACCC4CF8.asc
          . /etc/os-release
          printf 'deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt %s-pgdg main\n' "$VERSION_CODENAME" | sudo tee /etc/apt/sources.list.d/pgdg.list > /dev/null
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-client-17
          echo '/usr/lib/postgresql/17/bin' >> "$GITHUB_PATH"

      - name: Decrypt restore and verify
        shell: bash
        run: |
          set -euo pipefail
          trap 'rm -f "$RUNNER_TEMP/recovery.dump" "$RUNNER_TEMP/recovery.toc"' EXIT
          test -n "$BACKUP_PASSPHRASE"
          openssl enc -d -aes-256-cbc -pbkdf2 -iter 200000             -in "$RUNNER_TEMP/restore-drill/zermatt-live.dump.enc"             -out "$RUNNER_TEMP/recovery.dump"             -pass env:BACKUP_PASSPHRASE
          pg_restore --list "$RUNNER_TEMP/recovery.dump" > "$RUNNER_TEMP/recovery.toc"
          sed -i '/^[0-9][0-9]*;.* SCHEMA - public /d' "$RUNNER_TEMP/recovery.toc"
          pg_restore --single-transaction --exit-on-error --no-owner --no-privileges             --use-list "$RUNNER_TEMP/recovery.toc"             --dbname postgres "$RUNNER_TEMP/recovery.dump"
          tables=$(psql -X -A -t -v ON_ERROR_STOP=1 -c "SELECT count(*) FROM information_schema.tables WHERE table_schema='public' AND table_type='BASE TABLE'")
          employees=$(psql -X -A -t -v ON_ERROR_STOP=1 -c 'SELECT count(*) FROM public.employees')
          migrations=$(psql -X -A -t -v ON_ERROR_STOP=1 -c 'SELECT count(*) FROM public._prisma_migrations WHERE finished_at IS NOT NULL')
          organizations=$(psql -X -A -t -v ON_ERROR_STOP=1 -c 'SELECT count(*) FROM public.organizations')
          test "$tables" -ge 95
          test "$employees" -ge 300
          test "$migrations" -ge 64
          test "$organizations" -eq 2
          printf 'Restore drill passed: tables=%s employees=%s migrations=%s organizations=%s\n' "$tables" "$employees" "$migrations" "$organizations"
