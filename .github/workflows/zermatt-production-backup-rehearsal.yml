name: Zermatt Production Backup Rehearsal

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backup-and-restore:
    name: Backup Zermatt and prove restore
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      restore-db:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: rehearsal
          POSTGRES_DB: restore_rehearsal
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d restore_rehearsal"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12

    env:
      ZERMATT_DATABASE_URL: ${{ secrets.ZERMATT_DATABASE_URL }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Require protected database secret
        shell: bash
        run: |
          if [ -z "$ZERMATT_DATABASE_URL" ]; then
            echo "::error::Repository secret ZERMATT_DATABASE_URL is not configured."
            exit 1
          fi

      - name: Create PostgreSQL 16 custom-format backup
        id: dump
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p backup
          stamp="$(date -u +'%Y%m%dT%H%M%SZ')"
          file="backup/zermatt-production-${stamp}.dump"
          docker run --rm \
            -e DATABASE_URL="$ZERMATT_DATABASE_URL" \
            postgres:16 \
            sh -lc 'pg_dump "$DATABASE_URL" --format=custom --compress=9 --no-owner --no-acl' \
            > "$file"
          test -s "$file"
          sha256sum "$file" | tee "${file}.sha256"
          echo "file=$file" >> "$GITHUB_OUTPUT"
          echo "checksum=${file}.sha256" >> "$GITHUB_OUTPUT"

      - name: Capture source integrity counters
        id: source
        shell: bash
        run: |
          set -euo pipefail
          query="SELECT
            (SELECT COUNT(*) FROM information_schema.tables WHERE table_schema='public' AND table_type='BASE TABLE')::text || '|' ||
            (SELECT COUNT(*) FROM \"_prisma_migrations\")::text || '|' ||
            (SELECT COUNT(*) FROM employees)::text || '|' ||
            (SELECT COUNT(*) FROM organizations)::text;"
          source_counts="$(docker run --rm -e DATABASE_URL="$ZERMATT_DATABASE_URL" postgres:16 sh -lc 'psql "$DATABASE_URL" -Atv ON_ERROR_STOP=1 -c "$0"' "$query")"
          echo "counts=$source_counts" >> "$GITHUB_OUTPUT"
          echo "Source integrity counters captured."

      - name: Store off-Render backup artifact
        uses: actions/upload-artifact@v4
        with:
          name: zermatt-production-backup
          path: |
            ${{ steps.dump.outputs.file }}
            ${{ steps.dump.outputs.checksum }}
          if-no-files-found: error
          retention-days: 30
          compression-level: 0

      - name: Restore backup into clean PostgreSQL 16
        shell: bash
        run: |
          set -euo pipefail
          docker run --rm --network host \
            -v "$PWD/backup:/backup:ro" \
            postgres:16 \
            pg_restore \
              --exit-on-error \
              --no-owner \
              --no-acl \
              --dbname=postgresql://postgres:rehearsal@127.0.0.1:5432/restore_rehearsal \
              "/backup/$(basename "${{ steps.dump.outputs.file }}")"

      - name: Verify restored database against source counters
        shell: bash
        env:
          SOURCE_COUNTS: ${{ steps.source.outputs.counts }}
        run: |
          set -euo pipefail
          query="SELECT
            (SELECT COUNT(*) FROM information_schema.tables WHERE table_schema='public' AND table_type='BASE TABLE')::text || '|' ||
            (SELECT COUNT(*) FROM \"_prisma_migrations\")::text || '|' ||
            (SELECT COUNT(*) FROM employees)::text || '|' ||
            (SELECT COUNT(*) FROM organizations)::text;"
          restored_counts="$(docker run --rm --network host postgres:16 psql postgresql://postgres:rehearsal@127.0.0.1:5432/restore_rehearsal -Atv ON_ERROR_STOP=1 -c "$query")"
          if [ "$SOURCE_COUNTS" != "$restored_counts" ]; then
            echo "::error::Restore verification counters do not match the source database."
            exit 1
          fi
          echo "Restore rehearsal passed: table, migration, employee, and organization counts match."
