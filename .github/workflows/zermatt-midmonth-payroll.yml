name: Zermatt mid-month payroll validation
on:
  pull_request:
    paths:
      - 'backend/**'
      - 'src/pages/payroll/**'
      - 'src/App.jsx'
      - 'src/pages/ESSPortal.jsx'
      - 'src/components/ess/**'
      - 'src/components/performance/**'
      - '.github/workflows/zermatt-midmonth-payroll.yml'
permissions:
  contents: read
jobs:
  payroll:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: fixture
          POSTGRES_PASSWORD: fixture-only
          POSTGRES_DB: chris_midmonth_test
        ports: ['5432:5432']
        options: --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
        working-directory: backend
      - run: node --test tests/performanceEvaluation.test.js tests/essLoanSummary.test.js tests/zermattSalarySplit.test.js tests/zermattSalaryWorkbook.test.js tests/zermattMidmonthDomain.test.js tests/zermattMidmonthIntegration.test.js
        working-directory: backend
        env:
          CHRIS_MIDMONTH_TEST_DATABASE_URL: postgresql://fixture:fixture-only@localhost:5432/chris_midmonth_test
      - name: Create isolated ESS leave database
        run: node -e "const {Client}=require('pg'); (async()=>{const db=new Client({connectionString:process.env.CHRIS_MIDMONTH_TEST_DATABASE_URL});await db.connect();await db.query('CREATE DATABASE chris_ess_leave_test');await db.end()})().catch(e=>{console.error(e);process.exit(1)})"
        working-directory: backend
        env:
          CHRIS_MIDMONTH_TEST_DATABASE_URL: postgresql://fixture:fixture-only@localhost:5432/chris_midmonth_test
      - name: Migrate isolated ESS leave database
        run: npx prisma migrate deploy
        working-directory: backend
        env:
          DATABASE_URL: postgresql://fixture:fixture-only@localhost:5432/chris_ess_leave_test
      - name: Test ESS leave API with concurrent applications
        run: node --test tests/essLeaveIntegration.test.js
        working-directory: backend
        env:
          CHRIS_ESS_LEAVE_TEST_DATABASE_URL: postgresql://fixture:fixture-only@localhost:5432/chris_ess_leave_test
      - run: npm ci
      - run: npm run build



