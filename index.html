<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
    <meta http-equiv="Pragma" content="no-cache" />
    <meta http-equiv="Expires" content="0" />
    <title>CHRiS</title>
    <style>
      #chris-boot-fallback {
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        box-sizing: border-box;
        padding: 24px;
        background: #07110c;
        color: #f7faf8;
        font-family: Arial, Helvetica, sans-serif;
      }
      #chris-boot-card {
        width: min(92vw, 460px);
        padding: 28px;
        border: 1px solid rgba(212,175,55,.45);
        border-radius: 16px;
        background: linear-gradient(145deg,#083221,#03140d);
        box-shadow: 0 18px 46px rgba(0,0,0,.28);
        text-align: center;
      }
      #chris-boot-mark {
        width: 58px;
        height: 58px;
        margin: 0 auto 16px;
        display: grid;
        place-items: center;
        border-radius: 50%;
        background: #d4af37;
        color: #07140d;
        font-weight: 900;
        font-size: 21px;
      }
      #chris-boot-title { margin: 0 0 10px; color: #d4af37; font-size: 22px; }
      #chris-boot-message { margin: 0; color: #c7d3cc; line-height: 1.65; font-size: 14px; }
      #chris-boot-retry {
        display: none;
        margin: 20px auto 0;
        padding: 11px 18px;
        border: 0;
        border-radius: 9px;
        background: #d4af37;
        color: #07140d;
        font-weight: 900;
        cursor: pointer;
      }
    </style>
    <script>
      (() => {
        const recoveryKey = "chris_boot_recovery_attempted";
        window.__CHRIS_BOOT_COMPLETE__ = false;

        const showRecovery = (message) => {
          const text = document.getElementById("chris-boot-message");
          const retry = document.getElementById("chris-boot-retry");
          if (text) text.textContent = message || "CHRiS could not finish starting. Reload the application to reconnect.";
          if (retry) retry.style.display = "inline-block";
        };

        window.__CHRIS_MARK_BOOT_COMPLETE__ = () => {
          window.__CHRIS_BOOT_COMPLETE__ = true;
          try { sessionStorage.removeItem(recoveryKey); } catch {}
        };

        window.__CHRIS_RETRY_BOOT__ = () => {
          try { sessionStorage.removeItem(recoveryKey); } catch {}
          const url = new URL(window.location.href);
          url.searchParams.set("__chris_reload", Date.now().toString());
          window.location.replace(url.toString());
        };

        const recoverOnce = () => {
          if (window.__CHRIS_BOOT_COMPLETE__) return;
          let attempted = false;
          try { attempted = sessionStorage.getItem(recoveryKey) === "1"; } catch {}
          if (!attempted) {
            try { sessionStorage.setItem(recoveryKey, "1"); } catch {}
            const url = new URL(window.location.href);
            url.searchParams.set("__chris_boot", Date.now().toString());
            window.location.replace(url.toString());
            return;
          }
          showRecovery("CHRiS did not finish loading after an automatic recovery attempt. Select Reload CHRiS.");
        };

        window.addEventListener("error", () => {
          if (!window.__CHRIS_BOOT_COMPLETE__) window.setTimeout(recoverOnce, 250);
        });

        window.addEventListener("unhandledrejection", () => {
          if (!window.__CHRIS_BOOT_COMPLETE__) window.setTimeout(recoverOnce, 250);
        });

        window.setTimeout(recoverOnce, 8000);
      })();
    </script>
  </head>
  <body>
    <div id="root">
      <div id="chris-boot-fallback" role="status" aria-live="polite">
        <div id="chris-boot-card">
          <div id="chris-boot-mark">CH</div>
          <h1 id="chris-boot-title">Starting CHRiS</h1>
          <p id="chris-boot-message">Loading the secure workspace...</p>
          <button id="chris-boot-retry" type="button" onclick="window.__CHRIS_RETRY_BOOT__()">Reload CHRiS</button>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
